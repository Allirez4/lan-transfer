[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-transfer"
version = "1.0.0"
description = "Durable local file transfers with a browser and desktop companion"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "anyio==4.15.1",
  "qrcode==8.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "psutil==7.2.2", "cryptography==50.0.1"]

[project.scripts]
lan-transfer = "lan_transfer_client.main:main"
lan-transfer-server = "lan_transfer.cli:main"

[project.gui-scripts]
lan-transfer-desktop = "lan_transfer.desktop:main"

[tool.setuptools]
packages = ["lan_transfer", "lan_transfer_client"]
package-dir = {lan_transfer = "backend/lan_transfer", lan_transfer_client = "client/lan_transfer_client"}
